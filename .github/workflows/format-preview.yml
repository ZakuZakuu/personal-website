name: Format Preview

on:
  push:
    branches:
      - content/cs336-resource-accounting

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write src/content/notes/cs336-resource-accounting.md
          git diff -- src/content/notes/cs336-resource-accounting.md
