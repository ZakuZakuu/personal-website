<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Content flow architecture</title>
  <desc id="desc">Markdown and MDX flow through typed collections into static pages and discovery outputs.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; fill: #303632; }
    .box { fill: #f7f6f2; stroke: #b8bdb5; stroke-width: 2; }
    .label { font-size: 19px; font-weight: 700; }
    .small { font-size: 13px; fill: #626862; }
    .path { fill: none; stroke: #176f5b; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#176f5b"/></marker></defs>
  <rect class="box" x="40" y="116" width="210" height="110" rx="10"/>
  <text class="label" x="145" y="160" text-anchor="middle">Markdown / MDX</text>
  <text class="small" x="145" y="190" text-anchor="middle">canonical source</text>
  <path class="path" d="M250 171H365"/>
  <rect class="box" x="365" y="85" width="230" height="172" rx="10"/>
  <text class="label" x="480" y="130" text-anchor="middle">Typed collections</text>
  <text class="small" x="480" y="165" text-anchor="middle">validation</text>
  <text class="small" x="480" y="190" text-anchor="middle">relationships</text>
  <text class="small" x="480" y="215" text-anchor="middle">ordering</text>
  <path class="path" d="M595 130H710"/>
  <path class="path" d="M595 212H710"/>
  <rect class="box" x="710" y="65" width="210" height="105" rx="10"/>
  <text class="label" x="815" y="108" text-anchor="middle">Static pages</text>
  <text class="small" x="815" y="137" text-anchor="middle">reader experience</text>
  <rect class="box" x="710" y="208" width="210" height="105" rx="10"/>
  <text class="label" x="815" y="251" text-anchor="middle">Discovery</text>
  <text class="small" x="815" y="280" text-anchor="middle">search · RSS · sitemap</text>
</svg>
